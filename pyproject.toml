[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-compact"
version = "0.1.0"
description = "Moving-highlight context compaction for agent harnesses — score, retain verbatim, tombstone, restore"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Luke Kimball" }]
keywords = ["context-compaction", "llm", "agents", "claude-code", "mcp"]

[project.scripts]
jev-compact = "jev_compact.cli:main"

[project.optional-dependencies]
# CI installs `pytest` directly today. Declaring it here lets a fresh clone
# reproduce the suite with `pip install -e ".[dev]"` instead of guessing.
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
